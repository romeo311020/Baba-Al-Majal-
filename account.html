<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>حسابي | يلا رياضة</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="styles.css"></head><body><div id="shared-header"></div><main class="wrap page"><span class="kicker">YOUR ACCOUNT</span><h1>حسابي</h1><p class="danger-note">هذه واجهة تجريبية فقط وليست تسجيل دخول آمنًا. لا تدخل كلمة مرور حقيقية هنا قبل ربط خدمة مصادقة موثوقة مثل Supabase Auth أو خادم خاص.</p><section class="panel"><h2>تسجيل الدخول / إنشاء حساب</h2><form id="account-form" class="form-stack"><input type="email" id="email" placeholder="البريد الإلكتروني" required><input type="password" id="password" placeholder="كلمة المرور (عرض تجريبي فقط)" required minlength="8"><button class="btn primary" type="submit">متابعة تجريبية</button></form><p id="account-message" class="note"></p><button id="logout" class="btn outline">تسجيل الخروج التجريبي</button></section></main><div id="shared-footer"></div><script src="app.js"></script></body></html>
