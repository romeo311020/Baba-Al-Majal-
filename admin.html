<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b0d12"><title>لوحة التحكم | يلا رياضة</title><link rel="icon" href="assets/logo.svg"><link rel="stylesheet" href="styles.css"></head><body><div id="shared-header"></div><main class="wrap page"><span class="kicker">SECURE ADMIN</span><h1>لوحة التحكم</h1><p class="danger-note">تتطلب هذه اللوحة إعداد Supabase وتشغيل ملف SQL أولًا. لا تضع أي Secret key داخل ملفات GitHub.</p><section class="panel" id="admin-login-panel"><h2>دخول المسؤول</h2><form id="admin-login-form" class="form-stack"><input id="admin-email" type="email" placeholder="البريد الإلكتروني" required><input id="admin-password" type="password" placeholder="كلمة المرور" required><button class="btn primary" type="submit">تسجيل الدخول</button></form><p id="admin-auth-message" class="note" role="status"></p><button class="btn outline" id="admin-logout" type="button" hidden>تسجيل الخروج</button></section><div id="admin-workspace" hidden><section class="panel"><h2>إضافة مباراة أو بث رسمي</h2><form id="match-form" class="form-stack"><input id="match-home" placeholder="الفريق الأول" required><input id="match-away" placeholder="الفريق الثاني" required><input id="match-league" placeholder="البطولة"><label>موعد المباراة <input id="match-kickoff" type="datetime-local"></label><label>حالة المباراة<select id="match-status"><option value="scheduled">لم تبدأ</option><option value="live">مباشر</option><option value="finished">انتهت</option></select></label><div class="row"><input id="match-home-score" type="number" min="0" placeholder="نتيجة الفريق الأول"><input id="match-away-score" type="number" min="0" placeholder="نتيجة الفريق الثاني"></div><input id="match-embed" type="url" placeholder="رابط Embed الرسمي (اختياري)"><textarea id="match-notes" placeholder="ملاحظات" rows="3"></textarea><label><input id="match-published" type="checkbox" checked> منشورة للزوار</label><button class="btn primary" type="submit">حفظ المباراة</button></form><p id="match-message" class="note" role="status"></p><div id="admin-matches"></div></section><section class="panel"><h2>إضافة منتج</h2><form id="product-form" class="form-stack"><input id="product-name" placeholder="اسم المنتج" required><textarea id="product-description" placeholder="وصف المنتج" rows="3"></textarea><input id="product-price" type="number" min="0" step="0.01" placeholder="السعر"><input id="product-image" type="url" placeholder="رابط صورة المنتج"><input id="product-buy" type="url" placeholder="رابط الشراء الخارجي (اختياري)"><label><input id="product-published" type="checkbox" checked> منشور</label><button class="btn primary" type="submit">حفظ المنتج</button></form><p id="product-message" class="note" role="status"></p><div id="admin-products"></div></section></div></main><div id="shared-footer"></div><script src="app.js"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js"></script><script src="supabase-client.js"></script><script src="supabase-admin.js"></script></body></html>
