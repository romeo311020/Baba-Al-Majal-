<title>ROMEO LIVE TV - المسلسل</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial;}
body{background:#001133;color:white;text-align:center;min-height:100vh;overflow-x:hidden;}
canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:-1;}
header{padding:20px;font-size:28px;font-weight:bold;background:rgba(0,0,0,0.4);backdrop-filter:blur(6px);text-shadow:0 0 10px #00aaff,0 0 20px #0066ff;}
.container{width:90%;max-width:1000px;margin:auto;margin-top:30px;}
.player{position:relative;padding-bottom:56.25%;height:0;overflow:hidden;border-radius:12px;box-shadow:0 0 25px black;}
.player iframe{position:absolute;top:0;left:0;width:100%;height:100%;border:0;}
.episodes-container{margin-top:25px;display:flex;flex-direction:column;gap:10px;}
.episode-row{display:flex;overflow-x:auto;gap:8px;padding-bottom:5px;}
.episode-row::-webkit-scrollbar{height:8px;}
.episode-row::-webkit-scrollbar-thumb{background:#00aaff;border-radius:4px;}
button{flex:0 0 auto;background:linear-gradient(45deg,#0066ff,#00aaff);border:none;padding:10px 18px;color:white;border-radius:8px;font-size:15px;cursor:pointer;box-shadow:0 0 10px #0077ff;transition:0.3s;}
button:hover{transform:scale(1.05);box-shadow:0 0 20px #00aaff;}
.back{margin-top:25px;}
</style>
</head>

<script>
function playEpisode(videoId){
document.getElementById("videoPlayer").src = "https://www.youtube.com/embed/" + videoId;
}

function goBack(){
window.location.href="https://romeo311020.github.io/romeo-live-tv-31/";
}

// الخلفية المتحركة
const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");
canvas.width = window.innerWidth;
canvas.height = window.innerHeight;
let particles = [];
for(let i=0;i<120;i++){
particles.push({x:Math.random()*canvas.width,y:Math.random()*canvas.height,size:Math.random()*2+1,speed:Math.random()*1+0.5});
}
function animate(){
ctx.clearRect(0,0,canvas.width,canvas.height);
particles.forEach(p=>{
p.y -= p.speed;
if(p.y<0)p.y = canvas.height;
ctx.beginPath();
ctx.arc(p.x,p.y,p.size,0,Math.PI*2);
let g = ctx.createRadialGradient(p.x,p.y,0,p.x,p.y,p.size*5);
g.addColorStop(0,"rgba(0,170,255,0.8)");
g.addColorStop(1,"rgba(255,255,255,0)");
ctx.fillStyle = g;
ctx.fill();
});
requestAnimationFrame(animate);
}
animate();
window.addEventListener("resize",()=>{canvas.width = window.innerWidth;canvas.height = window.innerHeight;});
</script>
