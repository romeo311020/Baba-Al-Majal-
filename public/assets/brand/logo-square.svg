<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="يلا رياضة | Yalla Riyada">
  <defs>
    <clipPath id="clip"><rect width="128" height="128" rx="30"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="glow" cx=".5" cy=".3" r=".8">
      <stop offset="0" stop-color="#17306b"/>
      <stop offset="1" stop-color="#070b16"/>
    </radialGradient>
  </defs>
  <!-- نسخة مربعة: رمز + اسم، للصور الشخصية والسوشيال ميديا -->
  <rect width="512" height="512" rx="96" fill="url(#glow)"/>
  <g transform="translate(136 70) scale(1.9)">
    <rect width="128" height="128" rx="30" fill="url(#bg)"/>
    <rect width="128" height="64" fill="url(#shine)" clip-path="url(#clip)"/>
    <path d="M34 34 L64 70" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M94 34 L64 70" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
    <path d="M64 70 L64 102" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
    <circle cx="98" cy="27" r="11" fill="#0b1224"/>
    <circle cx="98" cy="27" r="6.5" fill="#fff"/>
    <path d="M16 84 H38" stroke="#fff" stroke-opacity=".75" stroke-width="6" stroke-linecap="round"/>
    <path d="M22 98 H40" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
  </g>
  <text x="256" y="400" text-anchor="middle" font-family="Cairo, Tahoma, Arial, sans-serif" font-weight="800" font-size="58" fill="#ffffff">يلا رياضة</text>
  <text x="256" y="446" text-anchor="middle" font-family="Inter, Arial, sans-serif" font-weight="700" font-size="26" letter-spacing="8" fill="#22d3ee">YALLA RIYADA</text>
</svg>
