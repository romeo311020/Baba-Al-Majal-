<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Yalla Riyada">
  <defs>
    <clipPath id="clip"><rect width="128" height="128" rx="30"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2f7bff"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="128" height="128" rx="30" fill="url(#bg)"/>
  <rect width="128" height="64" fill="url(#shine)" clip-path="url(#clip)"/>
  <!-- حرف Y كسهم اندفاع -->
  <path d="M34 34 L64 70" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M94 34 L64 70" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
  <path d="M64 70 L64 102" stroke="#fff" stroke-width="13" stroke-linecap="round" fill="none"/>
  <!-- الكرة -->
  <circle cx="98" cy="27" r="11" fill="#0b1224"/>
  <circle cx="98" cy="27" r="6.5" fill="#fff"/>
  <!-- خطوط السرعة -->
  <path d="M16 84 H38" stroke="#fff" stroke-opacity=".75" stroke-width="6" stroke-linecap="round"/>
  <path d="M22 98 H40" stroke="#fff" stroke-opacity=".5" stroke-width="6" stroke-linecap="round"/>
</svg>
